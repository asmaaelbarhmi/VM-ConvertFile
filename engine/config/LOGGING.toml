# Journal réduit au minimum : le journal de débogage par défaut coûte ~70 % du temps de calcul.
warnings_action = "ignore"
warnings_capture = false
version = 1
disable_existing_loggers = false

[handlers.vide]
    class = "logging.NullHandler"

[loggers.inkstitch]
    level = "ERROR"
    handlers = ["vide"]

[root]
    level = "ERROR"
    handlers = ["vide"]
